# Mosquitto 2.x for EviCon-Probe (MQTT 5 request/response, persistent sessions)
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# keep queued QoS>=1 messages for offline persistent sessions (P7)
max_queued_messages 10000
persistent_client_expiration 1d
log_type error
log_type warning
log_type notice
