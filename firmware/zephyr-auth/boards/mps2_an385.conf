# As firmware/zephyr-mcu: its prj.conf additions (Zephyr's own network stack) and its board file
CONFIG_HEAP_MEM_POOL_SIZE=4096
# Zephyr's own network stack (no host sockets): static IPv4 configuration at boot
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# QEMU mps2-an385 (Cortex-M3): LAN9118 Ethernet (QEMU -nic user,model=lan9118), user-mode networking:
# the guest is 10.0.2.15, QEMU's NAT router 10.0.2.2 (it forwards to the host's 127.0.0.1 and to any
# address the host reaches, such as VM-B's broker)
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
# no entropy source on this machine: the TCP stack's random numbers come from the test generator
CONFIG_TEST_RANDOM_GENERATOR=y
# NVS on a simulated flash (RAM): the cutoff and tombstones are kept while the MCU runs (the measured
# fault model is "owner up"; a reboot loses them, unlike the internal flash of a real MCU)
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
