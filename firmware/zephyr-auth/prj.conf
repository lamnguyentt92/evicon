# Common: settings on NVS for the durable cutoff
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

# Networking + MQTT (native_sim variant)
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_MQTT_LIB=y
CONFIG_ZVFS_POLL_MAX=8
