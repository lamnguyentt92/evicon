# nRF52840 DK (Cortex-M4F, 1 MB flash, 256 KB RAM): the MQTT device over Thread (IEEE 802.15.4 radio,
# OpenThread minimal thread device, IPv6), NVS settings on the internal flash (storage_partition).
# Built for its flash and RAM footprint only (no board was available to run it). The frozen firmware
# addresses its broker and plant by IPv4, which this build keeps (IPv4 and IPv6 both in the image: an
# upper bound of the footprint); on a Thread network the broker would be reached through a border
# router with NAT64.
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_NET_IPV6=y
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_NEED_IPV6=y
