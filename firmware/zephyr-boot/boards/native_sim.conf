# native_sim: host BSD sockets (Native Simulator offloaded sockets, NSOS), so the firmware reaches
# the broker (VM-B) and evicon-plant (127.0.0.1:18092) without TAP setup. Release 068: the
# offload options NSOS depends on were missing, so 067's NSOS line was ignored (found by the
# first real Zephyr build). Flash is simulated and backed by a file (--flash=<file>), which keeps
# the cutoff across restarts.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
